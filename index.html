<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NexariOS v6.6</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-device="auto">

    <!-- BOTTOM NAVIGATION (GLOWING) -->
    <div id="bottomNav">
        <div class="navItem active" data-page="hrPage">
            <span class="icon">🔥</span>
            <span class="label">HR</span>
        </div>

        <div class="navItem" data-page="gamesPage">
            <span class="icon">⚾</span>
            <span class="label">Games</span>
        </div>

        <div class="navItem" data-page="accuracyPage">
            <span class="icon">📊</span>
            <span class="label">Accuracy</span>
        </div>

        <div class="navItem" data-page="settingsPage">
            <span class="icon">⚙️</span>
            <span class="label">Settings</span>
        </div>

        <div id="navSlider"></div>
    </div>

    <!-- HR PAGE -->
    <div id="hrPage" class="page active">
        <div id="hrControls">
            <label style="font-size:14px; opacity:0.8;">HR View:</label>
            <select id="hrViewSelect">
                <option value="10">Top 10</option>
                <option value="20">Top 20</option>
            </select>
        </div>
        <div id="signalsContainer"></div>
    </div>

    <!-- GAMES PAGE -->
    <div id="gamesPage" class="page">
        <div id="calendarBar">
            <button id="prevDate" class="clickerBtn">◀</button>
            <span id="currentDateLabel"></span>
            <button id="nextDate" class="clickerBtn">▶</button>
        </div>
        <div id="gamesContainer"></div>
    </div>

    <!-- ACCURACY PAGE -->
    <div id="accuracyPage" class="page">
        <div id="accuracyContainer"></div>
        <div id="accuracyDeep">
            <h3>Deep Metrics</h3>
            <div id="accDaily"></div>
            <div id="acc7"></div>
            <div id="acc30"></div>
            <div id="accBreakdown"></div>
            <div id="accTeams"></div>
            <div id="accPlayers"></div>
        </div>
    </div>

    <!-- SETTINGS PAGE -->
    <div id="settingsPage" class="page">
        <h3>Display</h3>
        <label>Device Mode:</label>
        <select id="deviceModeSelect">
            <option value="auto">Auto</option>
            <option value="mobile">Mobile</option>
            <option value="desktop">Desktop</option>
        </select>

        <label>Font Size:</label>
        <input type="range" id="fontSizeSlider" min="12" max="22" value="16">

        <h3>Data</h3>
        <label>Auto Refresh:</label>
        <select id="autoRefreshSelect">
            <option value="0">Off</option>
            <option value="30">30s</option>
            <option value="60">60s</option>
            <option value="300">5m</option>
        </select>

        <button id="forceRebuildBtn">Force Rebuild</button>
        <button id="clearCacheBtn">Clear Cache</button>

        <h3>System</h3>
        <div id="systemInfo"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
