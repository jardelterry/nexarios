<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexariOS</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!-- HEADER -->
    <header id="header">
        <h1>NexariOS</h1>
        <div id="ticker">HR Engine • Live</div>
    </header>

    <!-- MAIN PAGES -->
    <main>

        <!-- HR SIGNALS -->
        <section id="signalsPage" class="page active">
            <div id="signalsContainer"></div>
        </section>

        <!-- GAMES -->
        <section id="gamesPage" class="page">
            <div id="gamesContainer"></div>
        </section>

        <!-- ACCURACY -->
        <section id="accuracyPage" class="page">
            <div id="accuracyContainer"></div>
        </section>

        <!-- SYSTEM -->
        <section id="systemPage" class="page">
            <h2>System Settings</h2>

            <div class="settingBlock">
                <label>Theme</label>
                <select id="themeSelect">
                    <option value="dark">Dark</option>
                    <option value="light">Light</option>
                </select>
            </div>

            <div class="settingBlock">
                <label>Compatibility Mode</label>
                <select id="compatSelect">
                    <option value="auto">Auto</option>
                    <option value="mobile">Force Mobile</option>
                    <option value="desktop">Force Desktop</option>
                </select>
            </div>

            <div class="settingBlock">
                <label>Backwards Compatibility</label>
                <select id="backCompatSelect">
                    <option value="on">On</option>
                    <option value="off">Off</option>
                </select>
            </div>

            <div class="settingBlock">
                <label>Device Mode</label>
                <select id="deviceModeSelect">
                    <option value="auto">Auto</option>
                    <option value="mobile">Mobile</option>
                    <option value="desktop">Desktop</option>
                </select>
            </div>

            <div class="settingBlock">
                <label>Refresh Data</label>
                <button id="refreshBtn">Refresh</button>
            </div>

            <h2>Engine</h2>
            <div id="engineInfo"></div>

            <h2>Debug</h2>
            <div id="debugInfo"></div>

            <h2>About</h2>
            <p>NexariOS • HR Engine v6.6</p>
        </section>

    </main>

    <!-- FLOATING NAV -->
    <nav id="navBar">
        <div class="navItem active" data-page="signalsPage">
            <span class="navIcon">⚾</span>
        </div>
        <div class="navItem" data-page="gamesPage">
            <span class="navIcon">📅</span>
        </div>
        <div class="navItem" data-page="accuracyPage">
            <span class="navIcon">📊</span>
        </div>
        <div class="navItem" data-page="systemPage">
            <span class="navIcon">⚙️</span>
        </div>

        <div id="navSlider"></div>
    </nav>

    <script src="app.js"></script>
</body>
</html>
