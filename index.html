<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NexariOS</title>

    <!-- PWA -->
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ------------------------------
         TOP BAR
    ------------------------------ -->
    <div class="top-bar">
        <h1>NexariOS</h1>
    </div>

    <!-- ------------------------------
         HR TICKER (NEW)
    ------------------------------ -->
    <div id="hrTicker" style="
        display:none;
        position:fixed;
        top:0;
        left:0;
        right:0;
        background:#1A1A1A;
        padding:10px 14px;
        text-align:center;
        font-weight:600;
        z-index:999;
        border-bottom:1px solid #333;
    ">
        <span id="hrTickerText">HR EVENT</span>
    </div>

    <!-- ------------------------------
         MAIN LAYOUT
    ------------------------------ -->
    <div class="layout">

        <!-- LEFT COLUMN (Signals + Games) -->
        <div class="left-column">

            <!-- SIGNALS -->
            <div id="signalsTab" class="tab-page active active-desktop">
                <div class="section-title">HR Signals</div>
                <div id="signalsContainer" class="card-list"></div>
            </div>

            <!-- GAMES -->
            <div id="gamesTab" class="tab-page">
                <div class="section-title">Games</div>
                <div id="gamesContainer" class="card-list"></div>
            </div>

        </div>

        <!-- RIGHT COLUMN (System + Accuracy) -->
        <div class="right-column">

            <!-- SYSTEM -->
            <div id="systemTab" class="tab-page active-desktop">
                <div class="section-title">System</div>
                <div id="systemContainer" class="card-list"></div>
            </div>

            <!-- ACCURACY -->
            <div id="accuracyTab" class="tab-page active-desktop">
                <div class="section-title">Elite Accuracy</div>
                <div id="accuracyContainer" class="card-list"></div>
            </div>

        </div>

    </div>

    <!-- ------------------------------
         BOTTOM NAV (MOBILE)
    ------------------------------ -->
    <div class="bottom-nav mobile-only">
        <div class="bottom-nav-inner">
            <button class="tab-btn active" data-tab="signalsTab">Signals</button>
            <button class="tab-btn" data-tab="gamesTab">Games</button>
            <button class="tab-btn" data-tab="systemTab">System</button>
            <button class="tab-btn" data-tab="accuracyTab">Accuracy</button>
        </div>
    </div>

    <!-- ------------------------------
         SCRIPTS
    ------------------------------ -->
    <script src="app.js"></script>

</body>
</html>
